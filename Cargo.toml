[package]
name = "amareleo-chain"
version = "3.0.0"
authors = ["The Amareleo Team <amareleo@windeveloper.com>"]
description = "A lite Aleo development node"
homepage = "https://amareleo.com"
repository = "https://github.com/kaxxa123/amareleo-chain"
keywords = [
  "aleo",
  "amareleo",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.83.0" # Attention - Change the MSRV in rust-toolchain and in .circleci/config.yml as well

[workspace]
members = [
  "resources",
  "account",
  "cli", 
  "api", 
  "tracing",
  "node", 
  "node/bft",
  "node/bft/ledger-service",
  "node/bft/storage-service",
  "node/consensus",
  "node/metrics",
  "node/rest",
  "node/sync"
  ]

[workspace.dependencies.aleo-std]
version = "1.0.1"
default-features = false

[workspace.dependencies.snarkvm] # If this is updated, the rev in `node/rest/Cargo.toml` must be updated as well.
#path = "../snarkVM"
#git = "https://github.com/ProvableHQ/snarkVM.git"
#rev = "fe255cf"
version = "=4.0.0"
default-features = false
#features = [ "circuit", "console", "rocks" ]

[workspace.dependencies.anyhow]
version = "1.0"

[workspace.dependencies.clap]
version = "4.4"
default-features = false
features = [ "std" ]

[workspace.dependencies.crossterm]
version = "0.29"

[workspace.dependencies.futures]
version = "0.3"

[workspace.dependencies.proptest]
version = "=1.6.0" # Remove this once we upgrade to rand 0.9

[workspace.dependencies.base64]
version = "0.22"

[workspace.dependencies.tokio]
version = "1.28"

[workspace.dependencies.tokio-util]
version = "0.7"

[workspace.dependencies.itertools]
version = "0.14"

[workspace.dependencies.indexmap]
version = "2"
default-features = false

[workspace.dependencies.serde]
version = "1"
default-features = false

[workspace.dependencies.parking_lot]
version = "0.12"

[workspace.dependencies.tracing]
version = "0.1"
default-features = false

[workspace.dependencies.tracing-test]
version = "0.2"

[workspace.dependencies.tracing-subscriber]
version = "0.3"

[workspace.dependencies.test-strategy]
version = "0.4"

[workspace.dependencies.amareleo-chain-resources]
path = "./resources"
version = "=3.0.0"

[workspace.dependencies.amareleo-chain-account]
path = "./account"
version = "=3.0.0"

[workspace.dependencies.amareleo-chain-tracing]
path = "./tracing"
version = "=3.0.0"

[workspace.dependencies.amareleo-chain-cli]
path = "./cli"
version = "=3.0.0"

[workspace.dependencies.amareleo-chain-api]
path = "./api"
version = "=3.0.0"

[workspace.dependencies.amareleo-node-metrics]
path = "./node/metrics"
version = "=3.0.0"

[workspace.dependencies.amareleo-node]
path = "./node"
version = "=3.0.0"

[workspace.dependencies.amareleo-node-bft]
path = "./node/bft"
version = "=3.0.0"

[workspace.dependencies.amareleo-node-bft-storage-service]
path = "node/bft/storage-service"
version = "=3.0.0"

[workspace.dependencies.amareleo-node-bft-ledger-service]
path = "node/bft/ledger-service"
version = "=3.0.0"

[workspace.dependencies.amareleo-node-consensus]
path = "node/consensus"
version = "=3.0.0"

[workspace.dependencies.amareleo-node-sync]
path = "node/sync"
version = "=3.0.0"

[workspace.dependencies.amareleo-node-rest]
path = "./node/rest"
version = "=3.0.0"

[lib]
path = "src/lib.rs"
test = false

[[bin]]
name = "amareleo-chain"
path = "src/main.rs"
test = false

[features]
default = [ "amareleo-node-metrics", "amareleo-node/metrics", "amareleo-chain-cli/metrics" ]
history = [ "amareleo-node/history" ]
locktick = [
  "dep:locktick",
  "dep:tracing",
  "amareleo-chain-api/locktick",
  "amareleo-chain-cli/locktick",
  "amareleo-node/locktick",
  "amareleo-node-bft/locktick",
  "amareleo-node-consensus/locktick",
  "amareleo-node-metrics/locktick",
  "amareleo-node-rest/locktick",
  "amareleo-node-sync/locktick"
]
test_network = [ "amareleo-chain-cli/test_network" ]

[dependencies.anyhow]
workspace = true

[dependencies.clap]
workspace = true
features = [ "derive" ]

[dependencies.locktick]
version = "0.3"
optional = true

[dependencies.amareleo-chain-cli]
workspace = true

[dependencies.amareleo-chain-tracing]
workspace = true

[dependencies.amareleo-chain-api]
workspace = true

[dependencies.amareleo-node]
workspace = true

[dependencies.amareleo-node-bft]
workspace = true

[dependencies.amareleo-node-consensus]
workspace = true

[dependencies.amareleo-node-metrics]
workspace = true
optional = true

[dependencies.amareleo-node-rest]
workspace = true

[dependencies.amareleo-node-sync]
workspace = true

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
tikv-jemallocator = "0.5"

[dependencies.tracing]
workspace = true
optional = true

[dev-dependencies.rusty-hook]
version = "0.11.2"

[build-dependencies.built]
version = "0.8"
features = [ "git2" ]

[build-dependencies.toml]
version = "0.8"

[build-dependencies.walkdir]
version = "2"

[profile.release]
opt-level = 3
lto = "thin"
incremental = true
# uncomment the 2 lines below when building with the locktick feature
# debug = "line-tables-only"
# strip = "none"

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = "thin"
incremental = true
debug-assertions = false

[profile.dev]
opt-level = 2
lto = "off"
incremental = true

[profile.test]
opt-level = 2
lto = "thin"
incremental = true
debug = true
debug-assertions = true

[package.metadata.cargo-machete]
ignored = [
  "amareleo-chain-account",
  "amareleo-node", # Needed for metrics feature
  "amareleo-node-bft", # Needed for locktick features
  "amareleo-node-consensus", # Needed for locktick features
  "amareleo-node-rest", # Needed for locktick features
  "amareleo-node-sync", # Needed for locktick features
  "amareleo-node-metrics", # Needed for locktick feature
]
