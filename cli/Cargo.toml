[package]
name = "amareleo-chain-cli"
version = "3.0.0"
authors = ["The Amareleo Team <amareleo@windeveloper.com>"]
description = "A CLI for a lite Aleo development node"
homepage = "https://amareleo.com"
repository = "https://github.com/kaxxa123/amareleo-chain"
keywords = ["aleo", "amareleo", "blockchain", "decentralized", "zero-knowledge"]
categories = ["cryptography", "cryptography::cryptocurrencies", "os"]
license = "Apache-2.0"
edition = "2021"

[features]
locktick = [
    "dep:locktick",
    "amareleo-chain-api/locktick",
    "amareleo-node/locktick",
    "amareleo-node-rest/locktick",
    "snarkvm/locktick",
]
metrics = [
    "dep:amareleo-node-metrics",
    "amareleo-chain-api/metrics",
    "amareleo-node/metrics",
]
test_network = ["snarkvm/test_targets", "snarkvm/test_consensus_heights"]

[dependencies.anstyle]
version = "1"

[dependencies.anyhow]
workspace = true

[dependencies.glob]
version = "0.3"

[dependencies.clap]
workspace = true
features = [
    "derive",
    "color",
    "unstable-styles",
    "help",
    "cargo",
    "usage",
    "suggestions",
]

[dependencies.colored]
version = "3"

[dependencies.crossterm]
workspace = true

[dependencies.locktick]
version = "0.3"
features = ["parking_lot"]
optional = true

[dependencies.amareleo-node-metrics]
workspace = true
optional = true

[dependencies.num_cpus]
version = "1"

[dependencies.rayon]
version = "1"

[dependencies.self_update]
version = "0.42"
features = ["archive-zip", "compression-zip-deflate"]

[dependencies.amareleo-node]
workspace = true

[dependencies.amareleo-node-rest]
workspace = true

[dependencies.amareleo-chain-tracing]
workspace = true

[dependencies.amareleo-chain-api]
workspace = true

[dependencies.snarkvm]
workspace = true
features = ["parameters", "circuit", "package"]

[dependencies.time]
version = "0.3"
features = ["formatting"]

[dependencies.thiserror]
version = "2.0.11"

[dependencies.tokio]
workspace = true
features = ["rt", "rt-multi-thread"]

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true
features = ["env-filter"]

[target."cfg(target_family = \"unix\")".dependencies.nix]
version = "0.30"
default-features = false
features = ["resource"]
