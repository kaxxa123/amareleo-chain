[package]
name = "amareleo-node-bft"
version = "3.0.0"
authors = ["The Amareleo Team <amareleo@windeveloper.com>"]
description = "A memory pool for a lite Aleo development node"
homepage = "https://amareleo.com"
repository = "https://github.com/kaxxa123/amareleo-chain"
keywords = ["aleo", "amareleo", "blockchain", "decentralized", "zero-knowledge"]
categories = ["cryptography", "cryptography::cryptocurrencies", "os"]
license = "Apache-2.0"
edition = "2021"

[features]
default = []
locktick = [
    "dep:locktick",
    "amareleo-node-bft-ledger-service/locktick",
    "amareleo-node-bft-storage-service/locktick",
    "amareleo-node-sync/locktick",
    "snarkvm/locktick",
]
metrics = ["dep:amareleo-node-metrics", "amareleo-node-bft-ledger-service/metrics"]

test = [
    # "snarkvm/test" this breaks some of the tests
    "snarkvm/test-helpers",
    "amareleo-node-bft-ledger-service/test",
    "amareleo-node-bft-storage-service/test",
]

[dependencies.aleo-std]
workspace = true

[dependencies.hex]
version = "0.4"

[dependencies.anyhow]
workspace = true

[dependencies.async-recursion]
version = "1.0"

[dependencies.async-trait]
version = "0.1"

[dependencies.bytes]
version = "1"

[dependencies.colored]
version = "2"

[dependencies.futures]
workspace = true
features = ["thread-pool"]

[dependencies.indexmap]
workspace = true
features = ["serde", "rayon"]

[dependencies.locktick]
version = "0.3"
features = ["parking_lot", "tokio"]
optional = true

[dependencies.amareleo-node-metrics]
workspace  = true
optional = true

[dependencies.parking_lot]
workspace = true

[dependencies.rand]
version = "0.8"

[dependencies.rayon]
version = "1"

[dependencies.sha2]
version = "0.10"
default-features = false

[dependencies.amareleo-chain-tracing]
workspace = true

[dependencies.amareleo-chain-account]
workspace = true

[dependencies.amareleo-node-bft-ledger-service]
workspace = true
features = ["ledger", "prover"]

[dependencies.amareleo-node-bft-storage-service]
workspace = true
features = ["memory"]

[dependencies.amareleo-node-sync]
workspace = true

[dependencies.snarkvm]
workspace = true
features = ["utilities"]

[dependencies.time]
version = "0.3"

[dependencies.tokio]
workspace = true
features = ["macros", "rt-multi-thread", "signal"]

[dependencies.tracing]
workspace = true

[dependencies.rand_chacha]
version = "0.3.0"
default-features = false

[dev-dependencies.axum]
version = "0.8"

[dev-dependencies.axum-extra]
version = "0.10"
default-features = false
features = ["erased-json"]

[dev-dependencies.clap]
workspace = true
features = ["derive"]

[dev-dependencies.deadline]
version = "0.2"

[dev-dependencies.itertools]
version = "0.12"

[dev-dependencies.open]
version = "5"

[dev-dependencies.paste]
version = "1"

[dev-dependencies.pea2pea]
version = "0.49"

[dev-dependencies.proptest]
workspace = true

[dev-dependencies.rand_chacha]
version = "0.3"

[dev-dependencies.rand_distr]
version = "0.4"

[dev-dependencies.rayon]
version = "1"

[dev-dependencies.amareleo-node-bft]
workspace = true
features = ["test"]

[dev-dependencies.amareleo-node-sync]
workspace = true
features = ["test"]

[dev-dependencies.test-strategy]
workspace = true

[dev-dependencies.tower-http]
version = "0.6"
features = ["fs", "trace"]

[dev-dependencies.tracing-subscriber]
workspace = true
features = ["env-filter"]

[dev-dependencies.tracing-test]
workspace = true

[dev-dependencies.mockall]
version = "0.12.1"
