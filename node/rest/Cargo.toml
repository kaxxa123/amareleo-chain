[package]
name = "amareleo-node-rest"
version = "3.0.0"
authors = ["The Amareleo Team <amareleo@windeveloper.com>"]
description = "A REST API server for a lite Aleo development node"
homepage = "https://amareleo.com"
repository = "https://github.com/kaxxa123/amareleo-chain"
keywords = ["aleo", "amareleo", "blockchain", "decentralized", "zero-knowledge"]
categories = ["cryptography", "cryptography::cryptocurrencies", "os"]
license = "Apache-2.0"
edition = "2021"

[features]
default = ["parallel"]
parallel = ["rayon"]
history = ["snarkvm/history"]
locktick = ["dep:locktick", "amareleo-node-consensus/locktick"]

[dependencies.anyhow]
workspace = true

[dependencies.axum]
version = "0.8"

[dependencies.axum-extra]
version = "0.10"
features = ["erased-json", "typed-header"]

[dependencies.http]
version = "1.0"

[dependencies.indexmap]
workspace = true
features = ["serde", "rayon"]

[dependencies.jsonwebtoken]
version = "9.2"

[dependencies.locktick]
version = "0.3"
features = ["parking_lot"]
optional = true

[dependencies.once_cell]
version = "1.19"

[dependencies.parking_lot]
version = "0.12"

[dependencies.serde]
workspace = true
features = ["derive"]

[dependencies.serde_json]
version = "1"
features = ["preserve_order"]

[dependencies.serde_with]
version = "3"

[dependencies.amareleo-chain-tracing]
workspace = true

[dependencies.amareleo-node-consensus]
workspace = true

[dependencies.rand]
version = "0.8"

[dependencies.rayon]
version = "1"
optional = true

[dependencies.snarkvm]
workspace = true

[dependencies.time]
version = "0.3"

[dependencies.tokio]
workspace = true

[dependencies.tower_governor]
version = "0.7"

[dependencies.tower-http]
version = "0.6"
features = ["cors", "trace"]

[dependencies.tracing]
workspace = true

[dev-dependencies.base64]
workspace = true
